# Drop-in for the unit `openclaw gateway install` creates. Check the result with
#   systemctl --user cat openclaw-gateway.service
[Service]
EnvironmentFile=%h/.config/promoclown/openclaw.env
EnvironmentFile=%h/.config/promoclown/promo.env
# Skill CLIs live in ~/.local/bin; OpenClaw checks `requires.bins` on this PATH.
Environment=PATH=%h/.local/bin:%h/.openclaw/bin:/usr/local/bin:/usr/bin:/bin
