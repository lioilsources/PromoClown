# Drop-in for the unit `openclaw gateway install` creates. Check the result with
#   systemctl --user cat openclaw-gateway.service
#
# PATH is deliberately NOT set here: `openclaw gateway install` already writes
# a PATH that includes ~/.local/bin (where the promo skill CLIs live), and a
# second Environment=PATH= in a drop-in replaces it rather than extending it
# (systemd keeps only the last value per key) — `openclaw doctor` flags the
# gap immediately. Run `systemctl --user cat openclaw-gateway.service` after
# any reinstall to confirm ~/.local/bin is still on the merged PATH.
[Service]
EnvironmentFile=%h/.config/promoclown/openclaw.env
EnvironmentFile=%h/.config/promoclown/promo.env
