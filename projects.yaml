# Seed for promo-api: promo projects import projects.yaml (admin token).
#
# Only facts found in the app repositories (2026-09-11). Apps that are not
# publicly available are "paused": the agent does not promote them. Flip one to
# "active" and add its store link when it goes live, then import again.

projects:
  - slug: kirian
    name: "Kirian: Space Shooter"
    status: active
    tagline: Roguelike arcade shmup — a 2D vertical-scrolling space shooter with a roguelike loop.
    audience: Shoot 'em up and retro arcade fans on iPhone and iPad.
    tags: [shmup, roguelike, arcade, indie game, flutter]
    store_ios_url: https://apps.apple.com/us/app/kirian/id6774868017
    ios_app_id: "6774868017"
    # Android is in closed testing: a public Play link would not open yet.
    android_package: com.ol1n.kiran
    website_url: https://lioilsources.github.io/Kiran/
    assets_dir: kirian
    hooks:
      - 18 sectors, 12 enemy types and 8 weapons, with a roguelike loop between runs.
      - Local Wi-Fi co-op for two players on the couch.
      - Free with no ads; 14 ship skins, some of them $0.99 each.
      - Game Center leaderboards and game controller support.
    forbidden_claims:
      - on Google Play
      - available on Android
      - on Steam
      - online multiplayer
      - pay to win

  # Tsumiki posts tributes: somebody else's picture restyled four ways, with a
  # credit to its author. Several a day are fine and they need no weekly gap —
  # each one is a different artist, not a repeat of the same announcement. They
  # go out from their own X account, so a busy Tsumiki day never blocks Kirian.
  - slug: tsumiki
    name: Tsumiki
    status: active
    tagline: A Telegram bot that restyles a photo into a painting while keeping the pose and the face.
    audience: Illustrators, manga and anime fans, and people who like seeing themselves painted.
    tags: [telegram bot, ai art, restyle, manga, illustration]
    website_url: https://t.me/tsumikimanga_bot
    assets_dir: tsumiki
    postiz_accounts:
      x: wakeupm_sfw
    daily_cap: 3
    min_days_between: 0
    # The bot link lives in the X profile, not in every post: X charges $0.20
    # for a post carrying a link against $0.015 for one without.
    link_in_profile: true
    hooks:
      - Send a photo, get it back as a painting — the pose and the face stay yours.
      - 90 painter and era styles, from Botticelli to ukiyo-e.
      - Runs on a machine at home, not on somebody's cloud.
    forbidden_claims:
      - free forever
      - unlimited

  - slug: doggiowars
    name: DoggioWars
    status: active
    tagline: You are the fighter plane — an aerial dogfight arena among floating voxel islands, a standalone Luanti game.
    audience: Luanti (Minetest) players and fans of arcade flight combat and voxel games.
    tags: [luanti, minetest, voxel, dogfight, open source]
    website_url: https://content.luanti.org/packages/lioilsources/doggiowars_game/
    assets_dir: doggiowars
    hooks:
      - 12 floating-island biomes, and the islands are destructible.
      - Dragons and sky whales share the sky with you.
      - Plays with a gamepad.
      - Twitch chat can join the fight.
    forbidden_claims:
      - on Roblox
      - on Steam
      - mobile app

  - slug: lexify
    name: Lexify
    status: paused # submitted to App Review; Play upload staged
    tagline: Picture flashcards in 17 languages. Swipe to learn, works offline.
    tags: [education, language learning, flashcards]
    android_package: com.ol1n.duolingoCards
    website_url: https://lioilsources.github.io/DuolingoCards/
    assets_dir: lexify
    forbidden_claims:
      - Duolingo
      - official

  - slug: puff
    name: "Puff: Pressure Blast"
    status: paused # TestFlight
    tagline: "Minimalist neon physics toy: hold to charge a pressure cloud, drag it, release to shatter the geometry."
    tags: [arcade, physics, casual game]
    android_package: com.ol1n.puff
    website_url: https://lioilsources.github.io/puff/
    assets_dir: puff

  - slug: poetrystream
    name: Poesie Simona Clinae
    status: paused # Google Play internal track / TestFlight
    tagline: A meditative app that streams Czech poetry with animated verse display.
    audience: Czech readers of poetry.
    tags: [poetry, czech, reading]
